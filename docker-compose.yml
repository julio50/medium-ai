services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    # all settings (OPENAI_*, TRANSCRIBE_MODEL, CORS_ORIGINS, ...) come from .env
    env_file: .env
    volumes:
      - ./backend/app/data:/app/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
