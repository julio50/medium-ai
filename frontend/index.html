<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/icon.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>medium-ai</title>
        <script>
            // Apply the colour theme before the first paint (no flash of the wrong
            // theme). Same rules as src/theme/theme.ts, which takes over from here.
            (function () {
                var pref = null;
                try {
                    pref = localStorage.getItem("theme");
                } catch (e) {
                    // storage blocked: follow the system
                }
                var theme = pref === "light" || pref === "dark" ? pref : "light";
                if (theme !== pref) {
                    try {
                        theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
                    } catch (e) {
                        // no matchMedia: light
                    }
                }
                document.documentElement.setAttribute("data-theme", theme);
                document.documentElement.style.colorScheme = theme;
            })();
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
